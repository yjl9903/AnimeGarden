name: Renovate

on:
  push:
    branches:
      - main
      - deps
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  queue: max

jobs:
  renovate-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: yjl9903/renovate-config/.github/actions/renovate-deps@main
