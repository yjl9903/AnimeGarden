name: Deploy Fly

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - test
      web:
        description: 'Deploy web'
        type: boolean
        required: true
        default: true
      server:
        description: 'Deploy server'
        type: boolean
        required: true
        default: false

jobs:
  web:
    name: Deploy Web ${{ github.event.inputs.environment }}

    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.web == 'true' }}

    concurrency:
      group: deploy-fly-web-${{ github.event.inputs.environment }}-group
      # Let deployment and its cache purge finish before starting another release.
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        if: ${{ inputs.environment == 'production' }}
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        if: ${{ inputs.environment == 'production' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: ${{ inputs.environment == 'production' }}
        run: pnpm install --frozen-lockfile

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: |
          flyctl deploy --config ./apps/web/fly.toml \
            --app animegarden-web-${{ github.event.inputs.environment }} \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Purge frontend page CDN cache
        if: ${{ success() && inputs.environment == 'production' }}
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_SEND_TELEMETRY: 'false'
        run: |
          # Purge the homepage by URL; a root prefix would also purge /assets/.
          pnpm exec cf cache purge \
            --zone "$CLOUDFLARE_ZONE_ID" \
            --body '{"files":["https://animes.garden/"]}' \
            --force

          # Page prefixes include query variants while preserving static assets.
          pnpm exec cf cache purge \
            --zone "$CLOUDFLARE_ZONE_ID" \
            --body '{"prefixes":["animes.garden/resources","animes.garden/subject","animes.garden/detail","animes.garden/calendar","animes.garden/collection","animes.garden/anime","animes.garden/about","animes.garden/iframe","animes.garden/docs/api"]}' \
            --force

  server:
    name: Deploy Server

    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.environment == 'production' && github.event.inputs.server == 'true' }}

    concurrency:
      group: deploy-fly-server-production-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: |
          flyctl secrets sync --app animegarden-server-production
          flyctl deploy --config ./apps/server/fly.server.toml \
            --app animegarden-server-production --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  feed:
    name: Deploy Feed Server

    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.environment == 'production' && github.event.inputs.server == 'true' }}

    concurrency:
      group: deploy-fly-feed-production-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: |
          flyctl secrets sync --app animegarden-feed-production
          flyctl deploy --config ./apps/server/fly.feed.toml \
            --app animegarden-feed-production --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
